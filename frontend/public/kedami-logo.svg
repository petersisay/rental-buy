<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Dark Charcoal Background Gradient -->
    <linearGradient id="bgDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D27" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>

    <!-- Vibrant Orange Monogram Gradient -->
    <linearGradient id="orangeMonogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA600" />
      <stop offset="50%" stop-color="#FF8E00" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Contrast -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect 
    x="32" 
    y="32" 
    width="960" 
    height="960" 
    rx="220" 
    fill="url(#bgDarkGrad)" 
    filter="url(#logoShadow)"
  />

  <!-- The Stylized 'ቀ' + 'R' Monogram (Stroke Width: 56, Rounded Caps & Joins) -->
  <g 
    fill="none" 
    stroke="url(#orangeMonogramGrad)" 
    stroke-width="58" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  >
    <!-- Left Loop of 'ቀ' (Circular Loop tangent to Center Stem) -->
    <path d="M 512 280 C 370 280, 226 360, 226 490 C 226 620, 370 690, 512 690 Z" />

    <!-- Center Vertical Stem of 'ቀ' -->
    <line x1="512" y1="124" x2="512" y2="760" />

    <!-- Right Upper Arc & Fluid Tail of 'R' (Real Estate / Kedami) -->
    <path d="M 512 250 C 670 250, 780 340, 780 470 C 780 580, 690 640, 576 640 L 560 640 C 650 640, 720 700, 706 790 C 696 850, 740 900, 840 900 C 890 900, 930 870, 960 830" />
  </g>
</svg>